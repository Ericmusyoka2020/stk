<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: system-ui, sans-serif; }
    .stock-row:hover { background-color: #f8fafc; }
    .cart-item { transition: all 0.2s; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-7xl mx-auto p-6">

    
    <div id="auth-screen" class="max-w-md mx-auto mt-20 bg-white rounded-2xl shadow-xl p-8">
      <h1 class="text-3xl font-bold text-center mb-8 text-indigo-600">Stock Manager</h1>
      <h2 id="form-title" class="text-2xl font-semibold text-center mb-6">Login</h2>
      
      <input id="email" type="email" placeholder="Email" class="w-full p-4 border rounded-xl mb-3 focus:outline-none focus:border-indigo-500">
      <input id="password" type="password" placeholder="Password" class="w-full p-4 border rounded-xl mb-6 focus:outline-none focus:border-indigo-500">
      
      <button onclick="handleAuth()" id="auth-btn"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 rounded-xl transition">Login</button>
      
      <p id="toggle-text" class="text-center mt-6 text-gray-600">
        Don't have an account? 
        <span onclick="toggleAuthMode()" class="text-indigo-600 cursor-pointer font-medium">Sign Up</span>
      </p>
    </div>

    
    <div id="dashboard" class="hidden">
      <div class="flex justify-between items-center mb-8">
        <h1 class="text-4xl font-bold text-gray-800">Stock Manager</h1>
        <button onclick="logout()" class="flex items-center gap-2 bg-red-100 hover:bg-red-200 text-red-700 px-5 py-2 rounded-2xl font-medium">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>

      
      <div class="bg-white rounded-3xl shadow p-6 mb-8 flex items-center justify-between">
        <div>
          <p class="text-sm text-gray-500">TOTAL PORTFOLIO VALUE</p>
          <p id="total-value" class="text-5xl font-bold text-emerald-600">KSh 0.00</p>
        </div>
        <i class="fas fa-chart-line text-6xl text-emerald-200"></i>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

        
        <div class="bg-white rounded-3xl shadow">
          <div class="p-6 border-b flex justify-between items-center">
            <h3 class="font-semibold text-xl">Inventory</h3>
            <button onclick="clearSelection()" 
                    class="text-sm text-gray-500 hover:text-red-600 flex items-center gap-1">
              <i class="fas fa-times"></i> Clear
            </button>
          </div>
          
          <div class="max-h-[600px] overflow-auto">
            <table class="w-full">
              <thead class="sticky top-0 bg-gray-100">
                <tr>
                  <th class="w-12 p-4"><input type="checkbox" id="select-all" onclick="toggleSelectAll()"></th>
                  <th class="text-left p-4">Item</th>
                  <th class="text-right p-4">Stock</th>
                  <th class="text-right p-4">Price</th>
                </tr>
              </thead>
              <tbody id="inventory-body" class="divide-y"></tbody>
            </table>
          </div>
        </div>

        
        <div class="bg-white rounded-3xl shadow">
          <div class="p-6 border-b bg-amber-50 rounded-t-3xl flex justify-between items-center">
            <h3 class="font-semibold text-xl flex items-center gap-2">
              <i class="fas fa-shopping-cart"></i> Sell Cart
            </h3>
            <span id="cart-count" class="bg-amber-600 text-white text-xs px-3 py-1 rounded-full font-medium">0 items</span>
          </div>

          <div id="cart-items" class="p-6 max-h-[500px] overflow-auto space-y-4">
            
          </div>

          <!-- Total & Confirm -->
          <div class="p-6 border-t bg-gray-50 rounded-b-3xl">
            <div class="flex justify-between text-lg mb-4">
              <span class="font-medium">Total Amount:</span>
              <span id="cart-total" class="font-bold text-2xl text-emerald-600">KSh 0.00</span>
            </div>
            <button onclick="confirmSell()" 
                    id="confirm-sell-btn"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-400 text-white font-semibold py-4 rounded-2xl transition">
              CONFIRM SELL
            </button>
          </div>
        </div>
      </div>

      <!-- Add New Item -->
      <div class="mt-10 bg-white rounded-3xl shadow p-6">
        <h3 class="font-semibold mb-4">Add New Stock Item</h3>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <input id="new-name" placeholder="Item name" class="p-4 border rounded-2xl">
          <input id="new-qty" type="number" value="10" placeholder="Initial Qty" class="p-4 border rounded-2xl">
          <input id="new-price" type="number" step="0.01" placeholder="Unit Price (KSh)" class="p-4 border rounded-2xl">
          <button onclick="addNewItem()" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-semibold">Add Item</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000';
    let currentToken = null;
    let cart = []; // {id, item_name, quantity_to_sell, unit_price, available_qty}

    async function apiFetch(endpoint, options = {}) {
      const res = await fetch(API + endpoint, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${currentToken}`
        }
      });
      const data = await res.json();
      if (!res.ok) throw data.error || 'Failed';
      return data;
    }

    // ==================== AUTH ====================
    function toggleAuthMode() { /* same as before */ 
      const title = document.getElementById('form-title');
      const btn = document.getElementById('auth-btn');
      const toggle = document.getElementById('toggle-text');
      if (title.textContent === 'Login') {
        title.textContent = 'Sign Up';
        btn.textContent = 'Create Account';
        toggle.innerHTML = `Already have account? <span onclick="toggleAuthMode()" class="text-indigo-600 cursor-pointer">Login</span>`;
      } else {
        title.textContent = 'Login';
        btn.textContent = 'Login';
        toggle.innerHTML = `No account? <span onclick="toggleAuthMode()" class="text-indigo-600 cursor-pointer">Sign Up</span>`;
      }
    }

    async function handleAuth() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const isLogin = document.getElementById('form-title').textContent === 'Login';

      if (!email || !password) return alert("Email and password required");

      try {
        const res = await fetch(API + (isLogin ? '/api/auth/login' : '/api/auth/signup'), {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email, password})
        });
        const data = await res.json();
        if (!res.ok) throw data.error || data;

        if (isLogin) {
          currentToken = data.access_token;
          localStorage.setItem('token', currentToken);
          showDashboard();
        } else {
          alert('Account created! Please login now.');
          toggleAuthMode();
        }
      } catch (e) {
        alert(e);
      }
    }

    function showDashboard() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      loadInventory();
    }

    // ==================== INVENTORY ====================
    async function loadInventory() {
      try {
        const stocks = await apiFetch('/api/inventory');
        const tbody = document.getElementById('inventory-body');
        tbody.innerHTML = '';

        stocks.forEach(stock => {
          const row = document.createElement('tr');
          row.className = 'stock-row';
          row.innerHTML = `
            <td class="p-4"><input type="checkbox" class="item-checkbox w-5 h-5" data-id="${stock.id}" onchange="addToCart('${stock.id}', '${stock.item_name}', ${stock.quantity}, ${stock.unit_price})"></td>
            <td class="p-4 font-medium">${stock.item_name}</td>
            <td class="p-4 text-right font-mono">${stock.quantity}</td>
            <td class="p-4 text-right font-mono">KSh ${Number(stock.unit_price).toFixed(2)}</td>
          `;
          tbody.appendChild(row);
        });

        updatePortfolioValue(stocks);
      } catch (e) {
        console.error(e);
      }
    }

    function updatePortfolioValue(stocks) {
      let total = 0;
      stocks.forEach(s => total += s.quantity * s.unit_price);
      document.getElementById('total-value').textContent = `KSh ${total.toFixed(2)}`;
    }

    // ==================== CART FUNCTIONS ====================
    function addToCart(id, name, available, price) {
      const checkbox = event.target;
      
      if (checkbox.checked) {
        // Add to cart if not already there
        if (!cart.find(item => item.id === id)) {
          cart.push({
            id,
            item_name: name,
            available_qty: available,
            unit_price: price,
            quantity_to_sell: 1   // default 1
          });
        }
      } else {
        // Remove from cart
        cart = cart.filter(item => item.id !== id);
      }
      
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-gray-400 text-center py-10">No items selected yet.<br>Select items from left to add to sell cart.</p>`;
        document.getElementById('cart-count').textContent = '0 items';
        document.getElementById('cart-total').textContent = 'KSh 0.00';
        document.getElementById('confirm-sell-btn').disabled = true;
        return;
      }

      let totalAmount = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.quantity_to_sell * item.unit_price;
        totalAmount += itemTotal;

        const div = document.createElement('div');
        div.className = 'cart-item bg-gray-50 p-4 rounded-2xl flex gap-4 items-center';
        div.innerHTML = `
          <div class="flex-1">
            <p class="font-medium">${item.item_name}</p>
            <p class="text-sm text-gray-500">Available: ${item.available_qty}</p>
          </div>
          <div class="flex items-center gap-3">
            <button onclick="changeCartQty(${index}, -1)" class="w-8 h-8 flex items-center justify-center bg-white rounded-xl shadow">-</button>
            <input type="number" value="${item.quantity_to_sell}" 
                   onchange="updateCartQty(${index}, this.value)"
                   class="w-16 text-center border rounded-xl p-2 font-mono">
            <button onclick="changeCartQty(${index}, 1)" class="w-8 h-8 flex items-center justify-center bg-white rounded-xl shadow">+</button>
          </div>
          <div class="text-right min-w-[100px]">
            <p class="font-semibold">KSh ${itemTotal.toFixed(2)}</p>
            <p class="text-xs text-gray-500">× KSh ${item.unit_price.toFixed(2)}</p>
          </div>
          <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700">
            <i class="fas fa-times"></i>
          </button>
        `;
        container.appendChild(div);
      });

      document.getElementById('cart-count').textContent = `${cart.length} item${cart.length > 1 ? 's' : ''}`;
      document.getElementById('cart-total').textContent = `KSh ${totalAmount.toFixed(2)}`;
      document.getElementById('confirm-sell-btn').disabled = false;
    }

    function changeCartQty(index, change) {
      const item = cart[index];
      let newQty = item.quantity_to_sell + change;
      if (newQty < 1) newQty = 1;
      if (newQty > item.available_qty) newQty = item.available_qty;
      item.quantity_to_sell = newQty;
      renderCart();
    }

    function updateCartQty(index, value) {
      const newQty = parseInt(value) || 1;
      const item = cart[index];
      item.quantity_to_sell = Math.max(1, Math.min(newQty, item.available_qty));
      renderCart();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      // Also uncheck the checkbox in inventory
      const checkboxes = document.querySelectorAll('.item-checkbox');
      checkboxes.forEach(cb => {
        if (cb.dataset.id === cart[index]?.id) cb.checked = false; // safety
      });
      renderCart();
    }

    function clearSelection() {
      cart = [];
      document.querySelectorAll('.item-checkbox').forEach(cb => cb.checked = false);
      renderCart();
    }

    async function confirmSell() {
      if (cart.length === 0) return;

      if (!confirm(`Confirm selling ${cart.length} items for total KSh ${document.getElementById('cart-total').textContent.replace('KSh ', '')}?`)) 
        return;

      let success = 0;
      let failed = 0;

      for (const item of cart) {
        try {
          await apiFetch(`/api/inventory/${item.id}/sell`, {
            method: 'POST',
            body: JSON.stringify({ amount: item.quantity_to_sell })
          });
          success++;
        } catch (e) {
          console.error(e);
          failed++;
        }
      }

      alert(`Sell completed!\nSuccess: ${success}\nFailed: ${failed}`);
      cart = [];
      loadInventory();   // refresh inventory and clear cart
    }

    // ==================== OTHER FUNCTIONS ====================
    async function addNewItem() {
      const name = document.getElementById('new-name').value.trim();
      const qty = parseInt(document.getElementById('new-qty').value) || 0;
      const price = parseFloat(document.getElementById('new-price').value) || 0;

      if (!name || price <= 0) return alert('Item name and price required');

      try {
        await apiFetch('/api/inventory', {
          method: 'POST',
          body: JSON.stringify({ item_name: name, quantity: qty, unit_price: price })
        });
        document.getElementById('new-name').value = '';
        loadInventory();
      } catch (e) { alert(e); }
    }

    function logout() {
      localStorage.removeItem('token');
      location.reload();
    }

    // Auto-login
    window.onload = () => {
      const saved = localStorage.getItem('token');
      if (saved) {
        currentToken = saved;
        showDashboard();
      }
    };
  </script>
</body>
</html>
